name: Release

on:
  push:
    tags: ["v*"]

# least privilege: the build only reads the repository, the publish job asks
# for its OIDC token itself
permissions:
  contents: read

# The actions are pinned to commit SHAs (a tag can be moved, a commit
# cannot); the comment behind each one names the release it is. Dependabot
# (.github/dependabot.yml) keeps both up to date.

jobs:
  build:
    name: check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history, to check below that the tag is part of main
          fetch-depth: 0

      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --locked

      - name: Run all checks
        run: |
          uv run ruff format --check
          uv run ruff check
          uv run mypy
          uv run pyright
          uv run ty check
          uv run pytest

      - name: Check that the tag matches __version__
        run: |
          version=$(uv run python -c "from action0.url import __version__; print(__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi

      - name: Check that the changelog has a section for the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## ${version//./\\.}( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## $version' section (still 'Unreleased'?)" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      # the checks above ran against the source tree; what gets published is
      # the wheel, so run the tests and the doctests against it on every
      # supported Python (--no-project keeps the source tree out of the
      # environment, --pyargs collects the doctests of the installed package)
      - name: Test the built wheel
        run: |
          for python in 3.11 3.12 3.13 3.14 3.15; do
            echo "::group::python $python"
            uv run --isolated --no-project --python "$python" \
              --with dist/*.whl --with pytest pytest tests --pyargs action0.url
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/action0-url
    permissions:
      # OIDC token for PyPI trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
