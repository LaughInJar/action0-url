name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# cancel superseded runs of the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          # 3.15 is still a pre-release: run it, but don't fail the whole
          # workflow while parts of the toolchain don't support it yet
          - python-version: "3.15"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: mypy
        run: uv run mypy

      - name: pyright
        run: uv run pyright

      - name: ty
        run: uv run ty check

      - name: pytest
        run: uv run pytest
