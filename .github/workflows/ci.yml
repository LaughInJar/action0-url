name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# least privilege: the jobs only read the repository, the docs deployment
# asks for what it needs itself
permissions:
  contents: read

# The actions are pinned to commit SHAs (a tag can be moved, a commit
# cannot); the comment behind each one names the release it is. Dependabot
# (.github/dependabot.yml) keeps both up to date.

# cancel superseded runs of a PR. Runs on main queue up instead: a running one
# is never cancelled (a push must not abort the docs deployment of the one
# before) and the docs are deployed in push order. GitHub keeps only one
# waiting run per group though, so when several pushes pile up behind a
# running one, only the newest of them runs - the ones in between are
# cancelled before they start.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # every job has a timeout: the default is 6 hours, and a hanging job (the
    # pre-release python is the likely one - continue-on-error forgives its
    # failure, not its duration) would hold back the docs deployment and
    # every later run on main for that long
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        experimental: [false]
        include:
          # 3.16 is still a pre-release: run it, but don't fail the whole
          # workflow while parts of the toolchain don't support it yet
          - python-version: "3.16"
            experimental: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: mypy
        run: uv run mypy

      - name: pyright
        run: uv run pyright

      - name: ty
        run: uv run ty check

      - name: pytest
        run: uv run pytest

  package:
    name: build and test the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # packaging mistakes should not surface only when a release is tagged
      - name: Build sdist and wheel
        run: uv build

      # the metadata check PyPI's upload action runs too (does the README
      # render, are the fields valid) - here, long before a tag is pushed
      - name: Check the package metadata
        run: uvx twine check dist/*

      # tests and doctests against the installed wheel instead of the source
      # tree (--no-project keeps the source tree out of the environment)
      - name: Test the built wheel
        run: >-
          uv run --isolated --no-project --with dist/*.whl --with pytest
          pytest tests --pyargs action0.url

  docs:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies
        run: uv sync --locked --group docs

      - name: Build documentation (warnings are errors)
        run: uv run --group docs sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy-docs:
    name: deploy docs
    # publish only what landed on main, and only if everything else passed
    # (a failing experimental python job does not count, see continue-on-error)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, package, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # the Pages site itself was enabled once via
    # `gh api repos/<owner>/<repo>/pages -X POST -f build_type=workflow`;
    # creating it from a workflow is impossible (GITHUB_TOKEN cannot get
    # repo-administration rights)
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
